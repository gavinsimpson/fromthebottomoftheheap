name: Refresh publication metadata

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - uses: r-lib/actions/setup-renv@v2

      - name: Refresh and verify publications
        run: |
          Rscript scripts/refresh-publications.R
          Rscript tests/test-publications.R
          quarto render publications/index.qmd

      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_BRANCH: automation/refresh-publications
        run: |
          if git diff --quiet -- publications/doi-cache.json publications/doi-suggestions.yml publications/publications.yml; then
            echo "Publication metadata is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$REFRESH_BRANCH"
          git add publications/doi-cache.json publications/doi-suggestions.yml publications/publications.yml
          git commit -m "Refresh publication metadata"
          git push --force origin "$REFRESH_BRANCH"

          existing_pr="$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$REFRESH_BRANCH" \
              --title "Refresh publication metadata" \
              --body "Automated weekly refresh of cached DOI metadata. The publications page and validation checks rendered successfully."
          fi
